# Managed by juliet-kyle: installed to /etc/systemd/coredump.conf.d/kyle.conf by
# bootstrap.bash :: setup-kyle-coredump-limits. Edit here, not in /etc.
# A runaway crash loop (drkonqi, left over from the KDE spin) once wrote 4.1GB
# of cores unnoticed; these caps keep any repeat bounded.
[Coredump]
MaxUse=512M
KeepFree=2G
ProcessSizeMax=256M
